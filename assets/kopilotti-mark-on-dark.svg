<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="128"
     height="128"
     viewBox="0 0 128 128"
     fill="none"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Kopilotti K-symboli (tumma tausta)</title>
  <desc id="desc">Geometrinen K-symboli, sama muoto kuin kopilotti-mark.svg:ssä. Runko valkoinen erottuvuuden vuoksi tummalla navy-taustalla; diagonaalit ja highlight ennallaan.</desc>

  <!-- Transparent canvas. Identical geometry to kopilotti-mark.svg - only
       the spine fill differs (#0B1F3A -> #FFFFFF) so the mark stays
       readable on the app headers' #101B3D background, where the original
       navy spine is nearly indistinguishable from the header itself. -->
  <rect x="20" y="16" width="24" height="96" rx="12" fill="#FFFFFF"/>
  <path d="M43 64L91 20"
        stroke="#1677FF"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <path d="M43 64L93 108"
        stroke="#1677FF"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <path d="M57 51L87 24"
        stroke="#8FD3FF"
        stroke-width="4"
        stroke-linecap="round"
        opacity="0.92"/>
</svg>
